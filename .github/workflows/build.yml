name: Build, Test & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CI_DEBUG_LOGS: '1'

jobs:
  build:
    name: Build (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.21 = asil derleme; 1.16.5 = en dusuk surumde olmayan API kullanilmadigini dogrular
        api: [ '1.21-R0.1-SNAPSHOT', '1.16.5-R0.1-SNAPSHOT' ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven package
        run: mvn -B -ntp -Dspigot.version=${{ matrix.api }} clean package
      - name: Verify jar contents
        run: |
          JAR=$(ls target/Portal-*.jar)
          unzip -l "$JAR"
          unzip -p "$JAR" plugin.yml | tee /dev/stderr | grep -Eq "^version: '[0-9]+\.[0-9]+\.[0-9]+'"
          unzip -p "$JAR" config.yml | grep -q "teleport-cooldown"
          # Java 8 bytecode (major 52) => 1.16.5 sunucularda Java 8 ile de calisir
          unzip -o -q "$JAR" org/jestron/portal/PortalPlugin.class -d /tmp/chk
          file /tmp/chk/org/jestron/portal/PortalPlugin.class | tee /dev/stderr | grep -q "version 52.0"
      - uses: actions/upload-artifact@v5
        if: matrix.api == '1.21-R0.1-SNAPSHOT'
        with:
          name: Portal-jar
          path: target/Portal-*.jar
          if-no-files-found: error

  integration:
    name: Integration (Paper ${{ matrix.mc }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.16.5'
            java: '11'
            worldedit: '7.2.'
          - mc: '1.21.4'
            java: '21'
            worldedit: '7.3.'
          - mc: '1.21.11'
            java: '21'
            worldedit: '7.3.'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: Portal-jar
          path: dist
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Download Paper + WorldEdit
        run: |
          set -o pipefail
          python3 test/fetch-server.py "${{ matrix.mc }}" server "${{ matrix.worldedit }}" 2>&1 | tee fetch.log
          cp dist/Portal-*.jar server/plugins/
          ls -la server server/plugins
      - name: Install test bots
        working-directory: test
        run: npm install --no-audit --no-fund
      - name: Run integration tests
        run: |
          set -o pipefail
          node test/it.js server "${{ matrix.mc }}" 2>&1 | tee it.log
      - name: Publish debug logs
        if: always() && env.CI_DEBUG_LOGS == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(mktemp -d)
          cp fetch.log it.log "$D"/ 2>/dev/null || true
          cp server/logs/latest.log "$D"/server.log 2>/dev/null || true
          cp server/results.json "$D"/ 2>/dev/null || true
          ls -la server server/plugins > "$D"/files.txt 2>&1 || true
          cd "$D" && git init -q && git checkout -q -b "ci-logs-${{ matrix.mc }}"
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "ci logs ${{ github.sha }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "ci-logs-${{ matrix.mc }}"
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: server-logs-${{ matrix.mc }}
          path: |
            server/logs/
            server/plugins/Portal/
            server/results.json
          if-no-files-found: ignore

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, integration ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: Portal-jar
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=RELEASE_NOTES.md
          [ -f "$NOTES" ] || echo "Portal ${GITHUB_REF_NAME}" > "$NOTES"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Portal-*.jar --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Portal-*.jar \
              --title "Portal ${GITHUB_REF_NAME}" --notes-file "$NOTES"
          fi
