name: Build, Test & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.21 = asil derleme; 1.16.5 = en dusuk surumde olmayan API kullanilmadigini dogrular
        api: [ '1.21-R0.1-SNAPSHOT', '1.16.5-R0.1-SNAPSHOT' ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven package
        run: mvn -B -ntp -Dspigot.version=${{ matrix.api }} clean package
      - name: Verify jar contents
        run: |
          JAR=$(ls target/Portal-*.jar)
          unzip -l "$JAR"
          unzip -p "$JAR" plugin.yml | tee /dev/stderr | grep -Eq "^version: '[0-9]+\.[0-9]+\.[0-9]+'"
          unzip -p "$JAR" config.yml | grep -q "teleport-cooldown"
          # Java 8 bytecode (major 52) => 1.16.5 sunucularda Java 8 ile de calisir
          unzip -o -q "$JAR" org/jestron/portal/PortalPlugin.class -d /tmp/chk
          file /tmp/chk/org/jestron/portal/PortalPlugin.class | tee /dev/stderr | grep -q "version 52.0"
      - uses: actions/upload-artifact@v5
        if: matrix.api == '1.21-R0.1-SNAPSHOT'
        with:
          name: Portal-jar
          path: target/Portal-*.jar
          if-no-files-found: error

  integration:
    name: Integration (Paper ${{ matrix.mc }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.16.5'
            java: '11'
            worldedit: '7.2.'
          - mc: '1.21.4'
            java: '21'
            worldedit: '7.3.'
          - mc: '1.21.11'
            java: '21'
            worldedit: '7.3.'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: Portal-jar
          path: dist
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Download Paper + WorldEdit
        run: |
          set -o pipefail
          python3 test/fetch-server.py "${{ matrix.mc }}" server "${{ matrix.worldedit }}" 2>&1 | tee fetch.log
          cp dist/Portal-*.jar server/plugins/
          ls -la server server/plugins
      - name: Install test bots
        working-directory: test
        run: npm install --no-audit --no-fund
      - name: Run integration tests
        run: |
          set -o pipefail
          node test/it.js server "${{ matrix.mc }}" 2>&1 | tee it.log
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: server-logs-${{ matrix.mc }}
          path: |
            server/logs/
            server/plugins/Portal/
            server/results.json
            fetch.log
            it.log
          if-no-files-found: ignore

  release:
    name: GitHub Release
    # main'e push: pom.xml surumu (v<surum>) henuz yayinlanmadiysa testleri gecen jar ile yayinlar.
    # v* etiketi: o etiketin surumunu yayinlar/gunceller.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [ build, integration ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: Portal-jar
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as E;n={'m':'http://maven.apache.org/POM/4.0.0'};print(E.parse('pom.xml').getroot().find('m:version',n).text)")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$VERSION"; fi
          JAR=$(ls dist/Portal-*.jar)
          echo "version=$VERSION tag=$TAG jar=$JAR"
          NOTES=RELEASE_NOTES.md
          [ -f "$NOTES" ] || echo "Portal $TAG" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              gh release upload "$TAG" "$JAR" --clobber
            else
              echo "Release $TAG already exists; nothing to publish."
            fi
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" \
              --title "Portal $TAG" --notes-file "$NOTES" --latest
          fi
      - name: Remove temporary CI log branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for b in $(git ls-remote --heads origin 'ci-logs-*' | awk '{print $2}' | sed 's#refs/heads/##'); do
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" && echo "deleted $b" || true
          done
