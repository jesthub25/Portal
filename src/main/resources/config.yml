  list: "&6Portallar &8({count})&7: &e{list}"
  list-separator: "&7, &e"

  # /portal (yardım) — sadece yetkili olduğu satırlar gösterilir
  help-header:
    - "&8&m------------------------------------"
    - "  &6&lPortal &7komutları"
    - "&8&m------------------------------------"
  help-create: "  &e/portal oluştur &b<ad> &8- &7WorldEdit seçiminden portal oluşturur"
  help-tphere: "  &e/portal tphere &b<ad> &8- &7Bulunduğun konumu hedef yapar"
  help-edit: "  &e/portal düzenle &b<ad> <pos1|pos2> <x> <y> <z> &8- &7Koordinat değiştirir"
  help-delete: "  &e/portal sil &b<ad> &8- &7Portalı kalıcı siler"
  help-info: "  &e/portal bilgi &b<ad> &8- &7Portal bilgisi"
