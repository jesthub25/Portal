  # {name} {pos} {x} {y} {z}
  position-updated: "&a{pos} güncellendi: &e{name} &8→ &fX:{x} Y:{y} Z:{z}"
  invalid-position: "&cGeçersiz konum! &epos1 &cveya &epos2 &ckullanın."
  invalid-coordinate: "&cGeçersiz koordinat: &e{value} &7(tam sayı veya ~ kullanın)"
  reloaded: "&aAyarlar ve portallar yeniden yüklendi. &7({count} portal)"

  usage-create: "&cKullanım: &e/portal oluştur <ad>"
