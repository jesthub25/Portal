    - "  &7Hedef: {destination}"
    - "&8&m------------------------------------"
  # {world} {x} {y} {z} {yaw} {pitch}
  info-destination: "&b{world} &fX:&b{x} &fY:&b{y} &fZ:&b{z} &8| &fYaw:&b{yaw} &fPitch:&b{pitch}"
  info-no-destination: "&cAyarlanmamış &7(/portal tphere <ad>)"
